consumers:
  - username: "dev-user"
    plugins:
      key-auth:
        key: "${{CONSUMER_API_KEY}}"
routes:
  - id: "1"
    name: "Ollama-Compatible-Gateway"
    uri: "/v1/*"
    plugins:
      serverless-pre-function:
        functions:
          - |
            return function(conf, ctx)
              local auth_header = core.request.header(ctx, "Authorization")
              if auth_header then
                -- Remove "Bearer " (case-insensitive) from the start of the string
                local token = ngx.re.gsub(auth_header, "^[Bb][Ee][Aa][Rr][Ee][Rr]\\s+", "", "jo")
                if token then
                  core.request.set_header(ctx, "Authorization", token)
                end
              end
            end
      key-auth: 
        header: "Authorization" # Standard OpenAI compatibility
      ai-proxy-multi:
        timeout: 300000
        allow_client_model_preference: true
        instances:
          - name: "gemma4:e4b"
            provider: "openai-compatible"
            weight: 1
            auth:
              header:
                Authorization: "Bearer ${{INTERNAL_OLLAMA_TOKEN}}"
            override:
              endpoint: "${{OLLAMA_ENDPOINT}}"
              model: "gemma4:e4b"
          - name: "gemma4:26b-a4b-it-q4_K_M"
            provider: "openai-compatible"
            weight: 1
            auth:
              header:
                Authorization: "Bearer ${{INTERNAL_OLLAMA_TOKEN}}"
            override:
              endpoint: "${{OLLAMA_ENDPOINT}}"
              model: "gemma4:26b-a4b-it-q4_K_M"
      file-logger:
        path: "/dev/stdout"
      ai-rate-limiting:
        instances:
          - name: "gemma4:e4b"
            limit: 10000000
            time_window: 3600
          - name: "gemma4:26b-a4b-it-q4_K_M"
            limit: 10000000
            time_window: 3600
        limit_strategy: "total_tokens"
        rejected_code: 429
        rejected_msg: "{\"error\": \"Model quota exceeded. Check model-specific limits in documentation.\"}"

#END