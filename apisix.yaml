consumers:
  - username: "dev-user-bearer"
    plugins:
      key-auth:
        key: "Bearer ${{CONSUMER_API_KEY}}"
routes:
  - id: "1"
    name: "Ollama-Compatible-Gateway"
    uris:
      - "/v1/chat/completions"
      - "/v1/completions"
    plugins:
      key-auth:
        header: "Authorization" # Standard OpenAI compatibility
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
                local core = require("apisix.core")
                ngx.req.read_body()
                local body_str = ngx.req.get_body_data()
                if body_str then
                    local ok, body = pcall(core.json.decode, body_str)
                    if ok and body and body.model then
                        ctx.picked_ai_instance_name = body.model
                    end
                end
            end
      ai-proxy:
        provider: "openai-compatible"
        timeout: 300000
        logging:
          summaries: true
        auth:
          header:
            Authorization: "Bearer ${{INTERNAL_OLLAMA_TOKEN}}"
        override:
          endpoint: "${{OLLAMA_ENDPOINT}}"
      file-logger:
        path: "/dev/stdout"
      ai-rate-limiting:
        instances:
          - name: "gemma4:e4b"
            limit: 10000000
            time_window: 3600
          - name: "gemma4:26b-a4b-it-q4_K_M"
            limit: 10000000
            time_window: 3600
        limit_strategy: "total_tokens"
        rejected_code: 429
        rejected_msg: "{\"error\": \"Model quota exceeded. Check model-specific limits in documentation.\"}"
  - id: "2"
    name: "OpenAI-Models-List"
    uris:
      - "/v1/models"
      - "/models"
    plugins:
      key-auth:
        header: "Authorization"
      mocking:
        content_type: "application/json"
        response_status: 200
        response_example: '{"object":"list","data":[{"id":"gemma4:e4b","object":"model","created":1677610602,"owned_by":"system"},{"id":"gemma4:26b-a4b-it-q4_K_M","object":"model","created":1677610602,"owned_by":"system"}]}'
#END
